name: Refresh profile cards

on:
  schedule:
    - cron: '17 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-cards-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install the font subsetter
        run: python -m pip install fonttools==4.65.0
      - name: Refresh the public contribution JSON
        run: python render.py --refresh
      - name: Render the profile
        run: |
          python -m doctest render.py
          python render.py
      - name: Commit changed cards and data
        run: |
          git add -- data/contributions.json cards README.md
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Refresh profile cards and contributions'
            git push
          fi
