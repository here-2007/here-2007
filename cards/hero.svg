.display{font-family:displayInk,Georgia,serif}
.sans{font-family:sansInk,'Arial Narrow',sans-serif}
@keyframes arrive{from{opacity:.64;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
@keyframes grow{from{transform:scaleY(.04)}to{transform:scaleY(1)}}
@keyframes ink{from{opacity:.25}to{opacity:1}}
@media (prefers-reduced-motion:no-preference){
  #content{animation:arrive .50s ease-out 0.05s backwards}
  .bar{transform-box:fill-box;transform-origin:center bottom;animation:grow .52s ease-out calc(0.05s + var(--lag)) backwards}
  .week{animation:ink .36s ease-out calc(0.05s + var(--lag)) backwards}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important}
  [pathLength]{stroke-dashoffset:0!important}
}</style>
