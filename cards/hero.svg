<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" role="img" aria-labelledby="title description">
<title id="title">Pernav Jain</title><desc id="description">Pernav Jain, @here-2007. I build models that write SQL, route tickets and map traffic.</desc>
<style>@font-face{font-family:displayInk;src:url(data:font/woff;base64,) format('woff')}
