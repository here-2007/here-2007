<svg xmlns="http://www.w3.org/2000/svg" width="960" height="119" viewBox="0 0 960 119" role="img" aria-labelledby="title description">
<title id="title">Loan risk</title><desc id="description">Loan-Risk on GitHub. A random forest estimates default risk from borrower data.</desc>
<style>@font-face{font-family:displayInk;src:url(data:font/woff;base64,) format('woff')}
@font-face{font-family:sansInk;src:url(data:font/woff;base64,) format('woff')}
.display{font-family:displayInk,Georgia,serif}
.sans{font-family:sansInk,'Arial Narrow',sans-serif}
@keyframes arrive{from{opacity:.64;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
@keyframes grow{from{transform:scaleY(.04)}to{transform:scaleY(1)}}
@keyframes ink{from{opacity:.25}to{opacity:1}}
@media (prefers-reduced-motion:no-preference){
  #content{animation:arrive .50s ease-out 3.11s backwards}
  .bar{transform-box:fill-box;transform-origin:center bottom;animation:grow .52s ease-out calc(3.11s + var(--lag)) backwards}
  .week{animation:ink .36s ease-out calc(3.11s + var(--lag)) backwards}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important}
  [pathLength]{stroke-dashoffset:0!important}
}</style>
<rect x="0.5" y=".5" width="959" height="118" rx="6" fill="#F8F2E7" stroke="#CDBEAB"/>
<g id="content"><g transform="translate(0 0)"><rect x="16" y="14" width="109" height="91" rx="3" fill="#EED1BF"/><g transform="translate(22 20)"><path d="M48 18v8 M27 37v-8h42v8 M27 45v5 M14 60v-8h26v8 M69 45v5 M57 60v-8h24v8" fill="none" stroke="#582937" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path><circle cx="48" cy="14" r="3.7" stroke="#582937" stroke-width="1.6" fill="#EED1BF"/><circle cx="27" cy="41" r="3.7" stroke="#582937" stroke-width="1.6" fill="#EED1BF"/><circle cx="69" cy="41" r="3.7" stroke="#582937" stroke-width="1.6" fill="#EED1BF"/><circle cx="14" cy="64" r="3.7" stroke="#582937" stroke-width="1.6" fill="#EED1BF"/><circle cx="40" cy="64" r="3.7" stroke="#582937" stroke-width="1.6" fill="#EED1BF"/><circle cx="57" cy="64" r="3.7" stroke="#582937" stroke-width="1.6" fill="#EED1BF"/><circle cx="81" cy="64" r="3.7" stroke="#582937" stroke-width="1.6" fill="#EED1BF"/></g><text x="150" y="31" class="sans" font-size="15" fill="#963E50" text-anchor="start" letter-spacing="1.9">CLASSIFICATION</text><text x="149" y="68" class="display" font-size="38" fill="#302725" text-anchor="start" letter-spacing="-0.6">Loan risk</text><text x="150" y="98" class="sans" font-size="24" fill="#67594F" text-anchor="start" letter-spacing="0">A random forest estimates default risk from borrower data.</text><g transform="translate(908 47) scale(1.125)"><path d="M1 15 15 1 M3 1h12v12" fill="none" stroke="#963E50" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1 1"><animate attributeName="stroke-dashoffset" from="1" to="0" begin="content.animationstart" dur=".55s" fill="remove"/></path></g></g></g>
</svg>
