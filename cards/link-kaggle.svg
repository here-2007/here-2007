<svg xmlns="http://www.w3.org/2000/svg" width="306" height="97" viewBox="0 0 306 97" role="img" aria-labelledby="title description">
<title id="title">Kaggle</title><desc id="description">Kaggle · Published datasets</desc>
<style>@font-face{font-family:displayInk;src:url(data:font/woff;base64,) format('woff')}
@font-face{font-family:sansInk;src:url(data:font/woff;base64,) format('woff')}
.display{font-family:displayInk,Georgia,serif}
.sans{font-family:sansInk,'Arial Narrow',sans-serif}
@keyframes arrive{from{opacity:.64;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
@keyframes grow{from{transform:scaleY(.04)}to{transform:scaleY(1)}}
@keyframes ink{from{opacity:.25}to{opacity:1}}
@media (prefers-reduced-motion:no-preference){
  #content{animation:arrive .50s ease-out 0.62s backwards}
  .bar{transform-box:fill-box;transform-origin:center bottom;animation:grow .52s ease-out calc(0.62s + var(--lag)) backwards}
  .week{animation:ink .36s ease-out calc(0.62s + var(--lag)) backwards}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important}
  [pathLength]{stroke-dashoffset:0!important}
}</style>
<rect x="2.5" y=".5" width="301" height="96" rx="6" fill="#DBDFCA" stroke="#CDBEAB"/>
<g id="content"><text x="19" y="53" class="display" font-size="35" fill="#49543C" text-anchor="start" letter-spacing="-0.6">Kaggle</text><text x="20" y="81" class="sans" font-size="20" fill="#49543C" text-anchor="start" letter-spacing="0">Published datasets</text><g transform="translate(271 16) scale(0.938)"><path d="M1 15 15 1 M3 1h12v12" fill="none" stroke="#49543C" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1 1"><animate attributeName="stroke-dashoffset" from="1" to="0" begin="content.animationstart" dur=".55s" fill="remove"/></path></g></g>
</svg>
